spring:

  config:
    import: optional:file:.env[.properties]
  application:
    name: monetrax
  ai:
    model:
      chat: none
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
          lob:
            non_contextual_creation: true
        order_inserts: true
        order_updates: true
    hibernate:
      ddl-auto: none
  flyway:
    locations: classpath:db/migration

logging:
  level:
    org.springframework.security: DEBUG

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
  refreshExpirationMs: 86400000
  refreshTokenLength: 64

aes-encryption:
  sha-crypt: SHA-256
  aes-algorithm: AES
  aes-algorithm-gcm: AES/GCM/NoPadding
  iv-length-encrypt: 12
  tag-length-encrypt: 16
  local-passphrase: ${LOCAL_PASSPHRASE}


external-apis:
  frankfurter:
    baseUrl:  https://api.frankfurter.dev
    readTimeout: 5
    connectTimeout: 3
