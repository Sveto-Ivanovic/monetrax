spring:
  application:
    name: monetrax
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:maindb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    #show-sql: true
    properties:
      hibernate:
        format_sql: true
        batch_size: 50
      order_inserts: true
      order_updates: true
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    locations: classpath:db-migration-h2

logging:
  level:
    org.springframework.security: DEBUG

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
  refreshExpirationMs: 86400000
  refreshTokenLength: 64

aes-encryption:
  sha-crypt: SHA-256
  aes-algorithm: AES
  aes-algorithm-gcm: AES/GCM/NoPadding
  iv-length-encrypt: 12
  tag-length-encrypt: 16
  local-passphrase: ${LOCAL_PASSPHRASE}