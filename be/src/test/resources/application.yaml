  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        batch_size: 50
      order_inserts: true
      order_updates: true
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    locations: classpath:db-migration-h2
