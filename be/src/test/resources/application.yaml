spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    #show-sql: true
    properties:
      hibernate:
        format_sql: true
        batch_size: 50
      order_inserts: true
      order_updates: true
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    locations: classpath:db-migration-h2
jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000
  refreshExpirationMs: 86400000
  refreshTokenLength: 64

aes-encryption:
  sha-crypt: SHA-256
  aes-algorithm: AES
  aes-algorithm-gcm: AES/GCM/NoPadding
  iv-length-encrypt: 12
  tag-length-encrypt: 16
  local-passphrase: ${LOCAL_PASSPHRASE}